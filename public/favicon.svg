<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!--
    KD Favicon — square format, interlocked K+D monogram on black background
  -->

  <!-- Black rounded square background -->
  <rect width="240" height="240" rx="40" fill="#0a0a0a" />

  <!-- K — white -->
  <path d="
    M 35 50
    L 77 50
    L 77 90
    L 125 50
    L 169 50
    L 109 110
    L 169 170
    L 125 170
    L 77 130
    L 77 170
    L 35 170
    Z"
    fill="#ffffff" />

  <!-- 4 squares — orange -->
  <rect x="43" y="138" width="10" height="10" fill="#ff6b1a" />
  <rect x="55" y="138" width="10" height="10" fill="#ff6b1a" />
  <rect x="43" y="150" width="10" height="10" fill="#ff6b1a" />
  <rect x="55" y="150" width="10" height="10" fill="#ff6b1a" />

  <!-- D — hollow orange outline -->
  <path d="
    M 131 50
    L 157 50
    Q 207 50 207 110
    L 207 110
    Q 207 170 157 170
    L 131 170
    Z"
    fill="#ff6b1a" />
  <path d="
    M 149 70
    L 157 70
    Q 187 70 187 110
    L 187 110
    Q 187 150 157 150
    L 149 150
    Z"
    fill="#0a0a0a" />
</svg>
