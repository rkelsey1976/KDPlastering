<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <!--
    KD Plastering & Rendering Services — Brand Mark (footer variant, on dark backgrounds)
    Same interlocked K+D structure as logo.svg, with inverted colours for dark backgrounds.
  -->

  <!-- K — SOLID white, chunky arms meeting at a single vertex -->
  <path d="
    M 28 30
    L 70 30
    L 70 70
    L 118 30
    L 162 30
    L 102 90
    L 162 150
    L 118 150
    L 70 110
    L 70 150
    L 28 150
    Z"
    fill="#ffffff" />

  <!-- 4 small squares in K's lower-left negative space — orange -->
  <rect x="36" y="116" width="10" height="10" fill="#ff6b1a" />
  <rect x="48" y="116" width="10" height="10" fill="#ff6b1a" />
  <rect x="36" y="128" width="10" height="10" fill="#ff6b1a" />
  <rect x="48" y="128" width="10" height="10" fill="#ff6b1a" />

  <!-- D — HOLLOW orange outline (in front of K's arm tips) -->
  <path d="
    M 124 30
    L 150 30
    Q 200 30 200 90
    L 200 90
    Q 200 150 150 150
    L 124 150
    Z"
    fill="#ff6b1a" />
  <path d="
    M 142 50
    L 150 50
    Q 180 50 180 90
    L 180 90
    Q 180 130 150 130
    L 142 130
    Z"
    fill="#0a0a0a" />

  <!-- ============ WORDMARK ============ -->
  <text x="218" y="92"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30"
        font-weight="600"
        fill="#ffffff"
        letter-spacing="-0.3">KD Plastering</text>

  <!-- Orange divider line -->
  <rect x="218" y="100" width="56" height="3" fill="#ff6b1a" />

  <!-- Tagline -->
  <text x="218" y="124"
        font-family="Inter, sans-serif"
        font-size="12"
        font-weight="700"
        fill="#ffffff"
        letter-spacing="3.2">RENDERING SERVICES</text>
</svg>
