<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <!--
    KD Plastering & Rendering Services — Brand Mark

    Layout (left to right):
      [KD monogram] | KD Plastering
                    | RENDERING SERVICES

    The monogram mimics the original logo's interlock:
      - K is SOLID black with chunky arms meeting at a single vertex
      - D is HOLLOW (outline) orange, sitting in FRONT of K's arm tips
      - 4 small squares sit in the K's lower-left negative space
  -->

  <!-- ============ KD MONOGRAM ============ -->

  <!-- K — SOLID black, chunky, arms meeting at single vertex -->
  <!-- Built as a single complex polygon to match the original's geometry -->
  <!-- Vertical stem on the left -->
  <path d="
    M 28 30
    L 70 30
    L 70 70
    L 118 30
    L 162 30
    L 102 90
    L 162 150
    L 118 150
    L 70 110
    L 70 150
    L 28 150
    Z"
    fill="#0a0a0a" />

  <!-- 4 small squares in K's lower-left negative space (light grey-blue → orange) -->
  <rect x="36" y="116" width="10" height="10" fill="#ff6b1a" />
  <rect x="48" y="116" width="10" height="10" fill="#ff6b1a" />
  <rect x="36" y="128" width="10" height="10" fill="#ff6b1a" />
  <rect x="48" y="128" width="10" height="10" fill="#ff6b1a" />

  <!-- D — HOLLOW orange outline (drawn AFTER K so it sits in front of the arm tips) -->
  <!-- Outer outline of the D -->
  <path d="
    M 124 30
    L 150 30
    Q 200 30 200 90
    L 200 90
    Q 200 150 150 150
    L 124 150
    Z"
    fill="#ff6b1a" />
  <!-- Inner counter (cut out so D reads as a hollow letterform, not a solid O) -->
  <path d="
    M 142 50
    L 150 50
    Q 180 50 180 90
    L 180 90
    Q 180 130 150 130
    L 142 130
    Z"
    fill="#ffffff" />

  <!-- ============ WORDMARK ============ -->
  <text x="218" y="92"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30"
        font-weight="600"
        fill="#0a0a0a"
        letter-spacing="-0.3">KD Plastering</text>

  <!-- Orange divider line under "Plastering" -->
  <rect x="218" y="100" width="56" height="3" fill="#ff6b1a" />

  <!-- "Rendering Services" tagline -->
  <text x="218" y="124"
        font-family="Inter, sans-serif"
        font-size="12"
        font-weight="700"
        fill="#0a0a0a"
        letter-spacing="3.2">RENDERING SERVICES</text>
</svg>
