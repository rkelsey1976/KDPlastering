<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none">
  <!--
    KD Plastering & Rendering Services — Brand Mark

    Layout (left to right):
      [KD monogram] | KD Plastering
                    | RENDERING SERVICES
  -->

  <!-- ============ KD MONOGRAM ============ -->

  <!-- K — black, bold, geometric -->
  <rect x="20" y="30" width="24" height="140" fill="#0a0a0a" />
  <polygon points="44,75 86,30 118,30 66,90" fill="#0a0a0a" />
  <polygon points="66,90 118,170 86,170 44,105" fill="#0a0a0a" />

  <!-- D — orange, rounded bowl -->
  <path d="M 112 30 L 140 30 Q 190 30 190 100 L 190 100 Q 190 170 140 170 L 112 170 Z" fill="#ff6b1a" />
  <!-- Inner counter (so it reads as a D not an O) -->
  <path d="M 124 50 L 140 50 Q 172 50 172 100 L 172 100 Q 172 150 140 150 L 124 150 Z" fill="#ffffff" />

  <!-- 4-square motif — sits in the right, in the K/D negative space -->
  <rect x="162" y="90" width="11" height="11" fill="#0a0a0a" />
  <rect x="175" y="90" width="11" height="11" fill="#0a0a0a" />
  <rect x="162" y="103" width="11" height="11" fill="#0a0a0a" />
  <rect x="175" y="103" width="11" height="11" fill="#0a0a0a" />

  <!-- ============ WORDMARK ============ -->
  <text x="210" y="92"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32"
        font-weight="800"
        fill="#0a0a0a"
        letter-spacing="-0.5">KD Plastering</text>

  <!-- Orange divider line under "Plastering" -->
  <rect x="210" y="102" width="64" height="4" fill="#ff6b1a" />

  <!-- "Rendering Services" tagline -->
  <text x="210" y="128"
        font-family="Inter, sans-serif"
        font-size="14"
        font-weight="700"
        fill="#0a0a0a"
        letter-spacing="3.5">RENDERING SERVICES</text>
</svg>
