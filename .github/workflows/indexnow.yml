name: IndexNow

# Ping IndexNow (Bing, Yandex, Seznam, Naver — not Google) after a content
# change lands on main. Netlify builds the same push; this waits for that
# exact commit to be published, then submits the sitemap's URLs.
#
# No secrets: IndexNow authenticates by the key file already served at
# https://www.kdplasteringrenderingservices.co.uk/<KEY>.txt

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
  workflow_dispatch: {}

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Netlify to publish this commit
        run: |
          set -euo pipefail
          URL="https://www.kdplasteringrenderingservices.co.uk/version.txt"
          for i in $(seq 1 40); do
            LIVE=$(curl -fsS --max-time 20 "$URL" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$LIVE" = "${GITHUB_SHA}" ]; then
              echo "published: $LIVE"
              exit 0
            fi
            echo "live=${LIVE:-<none>} want=${GITHUB_SHA} ($i/40)"
            sleep 15
          done
          echo "::warning::commit not confirmed published after 10 min; submitting anyway"

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow.mjs
